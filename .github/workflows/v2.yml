name: v2

on:
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: v2

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Scan for known vulnerabilities
        run: cargo audit

  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kprtfwd

      - name: Cluster tests
        run: cargo test -p kprtfwd-engine --test cluster --locked -- --test-threads=1 --nocapture
        env:
          KPRTFWD_TEST_CONTEXT: kind-kprtfwd
          KPRTFWD_TEST_PAUSE: docker pause kprtfwd-control-plane
          KPRTFWD_TEST_RESUME: docker unpause kprtfwd-control-plane
