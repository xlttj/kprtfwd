name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds without releasing, so changes to this workflow are tested, and
  # a dependency that breaks a release target shows up in its pull
  # request rather than at the tag. CI builds only the runners' targets.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - '**/Cargo.toml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A v2.0.0 tag on a commit that still says 2.0.0-dev would ship
  # binaries that report 2.0.0-dev.
  version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag is the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "kprtfwd") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} differs from the crate version ${version}; set version = \"${GITHUB_REF_NAME#v}\" in Cargo.toml and tag that commit."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches the crate version."

  # The whole CI (fmt, clippy, tests, audit, cluster tests) on the tagged
  # commit, so a tag cannot ship untested code. Pull requests run ci.yml
  # on their own.
  ci:
    if: startsWith(github.ref, 'refs/tags/')
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    # Pull requests skip the release checks above and build anyway.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: kprtfwd-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: kprtfwd-darwin-amd64
          # Static musl binaries run on every Linux, whatever its glibc.
          # Each is built on a runner of its architecture, which runs it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: kprtfwd-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: kprtfwd-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable

      # The C parts (bundled SQLite, ring) must be compiled against musl
      # as well. cc picks no musl compiler by itself for aarch64.
      - name: Set up musl
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p kprtfwd --target ${{ matrix.target }}

      - name: Name the binary
        run: cp target/${{ matrix.target }}/release/kprtfwd ${{ matrix.asset }}

      - name: Check that the binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          file ${{ matrix.asset }}
          ldd ${{ matrix.asset }} || true
          if ! file ${{ matrix.asset }} | grep -Eq '(statically|static-pie) linked'; then
            echo "::error::${{ matrix.asset }} is not statically linked"
            exit 1
          fi
          if ldd ${{ matrix.asset }} 2>&1 | grep -q '=>'; then
            echo "::error::${{ matrix.asset }} needs shared libraries"
            exit 1
          fi
          ./${{ matrix.asset }} --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    # Without a status function, this also requires every job in needs
    # to have succeeded.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Calculate checksums
        run: |
          sha256sum kprtfwd-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            kprtfwd-*
            checksums.txt
          body: |
            ## Changes

            See the git log for details.

            ## Installation

            Download the binary for your system (`kprtfwd-darwin-arm64`, `kprtfwd-darwin-amd64`, `kprtfwd-linux-amd64` or `kprtfwd-linux-arm64`), make it executable and put it on your `PATH`, for example:

            ```bash
            curl -fLO https://github.com/xlttj/kprtfwd/releases/download/${{ github.ref_name }}/kprtfwd-darwin-arm64
            chmod +x kprtfwd-darwin-arm64
            mv kprtfwd-darwin-arm64 /usr/local/bin/kprtfwd
            ```

            The Linux binaries are static and run on any distribution.

            The macOS binaries are not signed. macOS blocks a binary downloaded with a browser when it first starts; a download with `curl` is not affected. After a browser download, remove the quarantine flag before the first start:

            ```bash
            xattr -d com.apple.quarantine kprtfwd-darwin-arm64
            ```

            `checksums.txt` lists the SHA-256 checksum of every binary.

            ### From source

            ```bash
            cargo install --locked --git https://github.com/xlttj/kprtfwd --tag ${{ github.ref_name }} kprtfwd
            ```
