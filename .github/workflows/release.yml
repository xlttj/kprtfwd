name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds without releasing, so changes to this workflow are tested.
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: kprtfwd-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: kprtfwd-darwin-amd64
          # Static musl binaries run on every Linux, whatever its glibc.
          # Each is built on a runner of its architecture, which runs it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: kprtfwd-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: kprtfwd-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable

      # The C parts (bundled SQLite, ring) must be compiled against musl
      # as well. cc picks no musl compiler by itself for aarch64.
      - name: Set up musl
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p kprtfwd --target ${{ matrix.target }}

      - name: Name the binary
        run: cp target/${{ matrix.target }}/release/kprtfwd ${{ matrix.asset }}

      - name: Check that the binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          file ${{ matrix.asset }}
          ldd ${{ matrix.asset }} || true
          if ! file ${{ matrix.asset }} | grep -Eq '(statically|static-pie) linked'; then
            echo "::error::${{ matrix.asset }} is not statically linked"
            exit 1
          fi
          if ldd ${{ matrix.asset }} 2>&1 | grep -q '=>'; then
            echo "::error::${{ matrix.asset }} needs shared libraries"
            exit 1
          fi
          ./${{ matrix.asset }} --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Calculate checksums
        run: |
          sha256sum kprtfwd-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            kprtfwd-*
            checksums.txt
          body: |
            ## Changes

            See the git log for details.

            ## Installation

            Download the binary for your system, make it executable and put it on your `PATH`:

            ```bash
            chmod +x kprtfwd-darwin-arm64
            mv kprtfwd-darwin-arm64 /usr/local/bin/kprtfwd
            ```

            `checksums.txt` lists the SHA-256 checksum of every binary.

            ### From source

            ```bash
            cargo install --locked --git https://github.com/xlttj/kprtfwd --tag ${{ github.ref_name }} kprtfwd
            ```
