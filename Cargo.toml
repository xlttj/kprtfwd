[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/proto", "crates/daemon", "crates/cli", "crates/tui", "kprtfwd"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/xlttj/kprtfwd"

[workspace.dependencies]
kprtfwd-core = { path = "crates/core" }
kprtfwd-engine = { path = "crates/engine" }
kprtfwd-proto = { path = "crates/proto" }
kprtfwd-daemon = { path = "crates/daemon" }
kprtfwd-cli = { path = "crates/cli" }
kprtfwd-tui = { path = "crates/tui" }
anyhow = "1.0.104"
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
jiff = "0.2"
http-body-util = "0.1"
hyper = "1"
hyper-timeout = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["ws", "runtime"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["retry", "util"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
