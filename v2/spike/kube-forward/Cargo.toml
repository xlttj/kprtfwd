[package]
name = "kube-forward"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2.0", features = ["ws", "runtime"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
